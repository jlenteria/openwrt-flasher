name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-windows:
    name: Build Windows (.exe)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package the Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath openwrt-flasher-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-flasher-windows-x64
          path: openwrt-flasher-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build Linux (x64)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev
          # The versioned libstdc++ headers differ between Ubuntu releases.
          sudo apt-get install -y libstdc++-12-dev ||
            sudo apt-get install -y libstdc++-13-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package the Linux bundle
        run: |
          mkdir -p dist/openwrt-flasher
          cp -R build/linux/x64/release/bundle/. dist/openwrt-flasher/
          tar -C dist -czf openwrt-flasher-linux-x64.tar.gz openwrt-flasher
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-flasher-linux-x64
          path: openwrt-flasher-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package the macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/openwrt_flasher.app openwrt-flasher-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-flasher-macos
          path: openwrt-flasher-macos.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach builds to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
